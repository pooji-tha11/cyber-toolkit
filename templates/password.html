<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Analyzer</title>
</head>
<body>
    <h1>Password Security Analyzer</h1>
    <form method="POST">
        <label for="password">Enter a password to analyze:</label><br>
        <input type="text" id="password" name="password" required>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
        <h2>Result: {{ result.strength }} (score: {{ result.score }})</h2>
        <ul>
        {% for item in result.feedback %}
            <li>{{ item }}</li>
        {% endfor %}
        </ul>
    {% endif %}

    <p><a href="/">Back to Dashboard</a></p>
</body>
</html>
