{% extends "base.html" %}
{% block title %}URL Analyzer{% endblock %}
{% block content %}
    <h1 class="text-3xl font-bold mb-6">URL Security Analyzer</h1>

    <form method="POST" class="mb-6">
        <label for="url" class="block text-sm font-medium text-slate-300 mb-2">
            Enter a URL to analyze:
        </label>
        <input type="text" id="url" name="url" required placeholder="https://example.com"
               class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white mb-3
                      focus:outline-none focus:ring-2 focus:ring-blue-600">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md">
            Analyze
        </button>
    </form>

    {% if result %}
        <div class="bg-slate-800 border border-slate-700 rounded-lg p-5 mb-6">
            <p class="text-slate-400 mb-2">Analyzed: <span class="text-white break-all">{{ input_url }}</span></p>
            <h4 class="text-xl font-semibold mb-3">
                <span class="{% if 'High' in result.risk_level %}text-red-400
                              {% elif 'Medium' in result.risk_level %}text-yellow-400
                              {% elif 'Low' in result.risk_level %}text-green-400
                              {% else %}text-slate-400{% endif %}">
                    {{ result.risk_level }}
                </span>
            </h4>
            <ul class="list-disc list-inside text-slate-300 space-y-1">
            {% for item in result.feedback %}
                <li>{{ item }}</li>
            {% endfor %}
            </ul>
        </div>
    {% endif %}

    <a href="/" class="text-slate-400 hover:text-white underline">Back to Dashboard</a>
{% endblock %}
